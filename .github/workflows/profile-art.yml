name: Spider graph and stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/spider_graph.py]

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install font tools
        run: pip install fonttools==4.55.0
      - name: Draw graph and stats cards
        run: |
          python scripts/spider_graph.py
          python scripts/stats_card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Redraw spider graph"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
